<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>班陳-以圖搜圖</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans TC", sans-serif;
      line-height: 1.6;
      background: linear-gradient(135deg, #e6ffff 0%, #a3afca 100%);
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      padding: 2.5rem;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
      max-width: 500px;
      width: 100%;
      text-align: center;
      transition: all 0.3s ease;
    }

    .container:hover {
      transform: translateY(-5px);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
    }

    h2 {
      margin-bottom: 2rem;
      color: #4a5568;
      font-size: 2rem;
      font-weight: 700;
      background: linear-gradient(135deg,  #32ccc4 0%, #1b5a78 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .upload-area {
      border: 3px dashed #cbd5e0;
      border-radius: 16px;
      padding: 3rem 2rem;
      margin: 2rem 0;
      cursor: pointer;
      transition: all 0.3s ease;
      background: linear-gradient(145deg, #f8fafc, #e2e8f0);
      position: relative;
      overflow: hidden;
    }

    .upload-area::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
      transition: left 0.5s;
    }

    .upload-area:hover::before {
      left: 100%;
    }

    .upload-area:hover {
      border-color: #667eea;
      background: linear-gradient(145deg, #f0f4ff, #e6f0ff);
      transform: scale(1.02);
    }

    .upload-area.dragover {
      border-color: #4299e1;
      background: linear-gradient(145deg, #ebf8ff, #bee3f8);
      transform: scale(1.05);
    }

   .upload-icon {
      width: 80px;
      height: 80px;
      margin-bottom: 1rem;
      transition: all 0.3s ease;
      object-fit: contain;
    }

    .upload-area:hover .upload-icon {
      transform: scale(1.1);
    }

    .upload-text {
      font-size: 1.1rem;
      color: #4a5568;
      font-weight: 500;
    }

    .upload-subtext {
      font-size: 0.9rem;
      color: #718096;
      margin-top: 0.5rem;
    }

    #imgInput {
      display: none;
    }

    /* 修改：檔案名稱和預覽圖片的容器 */
    .file-info {
      margin-top: 1.5rem;
      padding: 1rem;
      background: linear-gradient(135deg, #e6fffa, #b2f5ea);
      border-radius: 12px;
      border-left: 4px solid #38b2ac;
      display: none;
      align-items: center;
      gap: 1rem;
      text-align: left;
    }

    .file-info.show {
      display: flex;
      animation: slideIn 0.3s ease;
    }

    .file-preview {
      width: 50px;
      height: 50px;
      border-radius: 8px;
      overflow: hidden;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .file-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .file-name {
      font-weight: 500;
      color: #2d3748;
      flex: 1;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .progress-container {
      margin: 1.5rem 0;
      display: none;
    }

    .progress-bar {
      width: 100%;
      height: 8px;
      background-color: #e2e8f0;
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #66eaea 0%, #7a0dbe 100%);
      width: 0%;
      transition: width 0.3s ease;
      border-radius: 4px;
    }

    .progress-text {
      margin-top: 0.5rem;
      font-size: 0.9rem;
      color: #4a5568;
    }

    #resultButtons {
      margin-top: 2rem;
      display: none;
      gap: 1rem;
      flex-direction: column;
    }

    #resultButtons.show {
      display: flex;
      animation: fadeInUp 0.5s ease;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* 搜尋引擎按鈕網格 */
    .engine-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
    }

    .search-btn {
      padding: 1rem 2rem;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      color: white;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
      flex: 1;
      font-family: inherit;
    }

    .search-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transition: left 0.5s;
    }

    .search-btn:hover::before {
      left: 100%;
    }

    .search-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    }

    .search-btn:focus-visible,
    .upload-area:focus-visible {
      outline: 3px solid #4299e1;
      outline-offset: 3px;
    }

    /* 全部搜尋按鈕 - 使用標題的漸層色 */
    #searchAllBtn {
      background: linear-gradient(135deg, #32ccc4, #1b5a78);
      font-size: 1.15rem;
    }

    /* Google Lens 按鈕 - 使用 Google Lens 的顏色 */
    #lensBtn {
      background: linear-gradient(135deg, #b68ad2, #7c2aae);
    }

    /* SauceNAO 按鈕 - 黑灰色系 */
    #saucenaoBtn {
      background: linear-gradient(135deg, #4a5568, #2d3748);
    }

    /* Bing 按鈕 - Bing 青綠 */
    #bingBtn {
      background: linear-gradient(135deg, #4fd1c5, #00796b);
    }

    /* TinEye 按鈕 - 藍色系 */
    #tineyeBtn {
      background: linear-gradient(135deg, #8cafe7, #1a73e8);
    }

    .popup-hint {
      font-size: 0.9rem;
      color: #975a16;
      background: #fffaf0;
      border-left: 4px solid #dd6b20;
      border-radius: 8px;
      padding: 0.6rem 0.8rem;
      text-align: left;
      display: none;
    }

    .popup-hint.show {
      display: block;
      animation: slideIn 0.3s ease;
    }

    #status, #error {
      margin-top: 1.5rem;
      font-size: 1rem;
      min-height: 1.2em;
      padding: 1rem;
      border-radius: 12px;
      font-weight: 500;
    }

    #status {
      background: linear-gradient(135deg, #f0fff4, #c6f6d5);
      color: #22543d;
      border-left: 4px solid #38a169;
      display: none;
    }

    #status.show {
      display: block;
      animation: slideIn 0.3s ease;
    }

    #error {
      background: linear-gradient(135deg, #fff5f5, #fed7d7);
      color: #742a2a;
      border-left: 4px solid #e53e3e;
      display: none;
    }

    #error.show {
      display: block;
      animation: slideIn 0.3s ease;
    }

    .reset-btn {
      margin-top: 1rem;
      padding: 0.8rem 1.5rem;
      background: linear-gradient(135deg, #718096, #4a5568);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.3s ease;
      display: none;
    }

    .reset-btn.show {
      display: inline-block;
    }

    .reset-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
    }

    @media (max-width: 480px) {
      .container {
        padding: 1.5rem;
        margin: 10px;
      }
      
      h2 {
        font-size: 1.5rem;
      }
      
      .upload-area {
        padding: 2rem 1rem;
      }

      .search-btn {
        font-size: 1rem;
        padding: 0.8rem 1rem;
      }

      .file-info {
        flex-direction: column;
        text-align: center;
        gap: 0.5rem;
      }

      .file-preview {
        align-self: center;
      }
    }
    
  </style>
</head>
<body>
  <div class="container">
    <h2>  班陳 以圖搜圖</h2>
    <div class="upload-area" id="dropArea" role="button" tabindex="0" aria-label="選擇要搜尋的圖片">
      <img src="images/Notes_250702_151640_774.png" alt="" class="upload-icon">
      <div class="upload-text">點擊、拖曳或 Ctrl+V 貼上圖片</div>
      <div class="upload-subtext">支援 JPG、PNG、GIF、WEBP 等格式，最大 32MB</div>
    </div>
    <input type="file" id="imgInput" accept="image/*">
    
    <!-- 修改：檔案資訊容器，包含預覽圖片和檔案名稱 -->
    <div class="file-info" id="fileInfo">
      <div class="file-preview" id="filePreview">
        <img id="previewImg" alt="圖片預覽">
      </div>
      <div class="file-name" id="fileName"></div>
    </div>
    
    <div class="progress-container" id="progressContainer">
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="progress-text" id="progressText">上傳中...</div>
    </div>

    <div id="resultButtons">
      <button type="button" id="searchAllBtn" class="search-btn">
        全部搜尋
      </button>
      <div class="popup-hint" id="popupHint" role="alert"></div>
      <div class="engine-grid">
        <a id="lensBtn" class="search-btn" target="_blank" rel="noopener noreferrer">Google Lens</a>
        <a id="saucenaoBtn" class="search-btn" target="_blank" rel="noopener noreferrer">SauceNAO</a>
        <a id="bingBtn" class="search-btn" target="_blank" rel="noopener noreferrer">Bing</a>
        <a id="tineyeBtn" class="search-btn" target="_blank" rel="noopener noreferrer">TinEye</a>
      </div>
    </div>

    <div id="status"></div>
    <div id="error"></div>
    
    <button class="reset-btn" id="resetBtn">重新選擇圖片</button>
  </div>

  <script>
    const IMGBB_API_KEY = '2c53aa8d5cd62de755c6e88a11d66e05';
    const MAX_FILE_SIZE = 32 * 1024 * 1024; // ImgBB 單檔上限 32MB
    const EXPIRATION_MS = 300000; // 5分鐘 = 300000毫秒

    // 搜尋引擎設定（u 為已編碼的圖片網址）
    const SEARCH_ENGINES = [
      { id: 'lensBtn', buildUrl: u => `https://lens.google.com/uploadbyurl?url=${u}` },
      { id: 'saucenaoBtn', buildUrl: u => `https://saucenao.com/search.php?url=${u}` },
      { id: 'bingBtn', buildUrl: u => `https://www.bing.com/images/search?view=detailv2&iss=sbi&q=imgurl:${u}` },
      { id: 'tineyeBtn', buildUrl: u => `https://tineye.com/search?url=${u}` }
    ];

    const dropArea = document.getElementById('dropArea');
    const fileInput = document.getElementById('imgInput');
    const statusDiv = document.getElementById('status');
    const errorDiv = document.getElementById('error');
    const fileInfo = document.getElementById('fileInfo');
    const fileName = document.getElementById('fileName');
    const resultButtons = document.getElementById('resultButtons');
    const searchAllBtn = document.getElementById('searchAllBtn');
    const popupHint = document.getElementById('popupHint');
    const progressContainer = document.getElementById('progressContainer');
    const progressFill = document.getElementById('progressFill');
    const progressText = document.getElementById('progressText');
    const resetBtn = document.getElementById('resetBtn');
    const previewImg = document.getElementById('previewImg');

    let countdownInterval;
    let currentXhr = null;      // 進行中的上傳請求
    let currentUploadId = 0;    // 用來忽略舊上傳的回應
    let previewObjectUrl = null;

    // 頁面載入時檢查是否有保存的圖片連結
    window.addEventListener('load', checkSavedImage);

    // 點擊上傳區域選擇檔案
    dropArea.addEventListener('click', () => fileInput.click());

    // 鍵盤操作：Enter 或空白鍵選擇檔案
    dropArea.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        fileInput.click();
      }
    });

    // 檔案選擇後自動上傳
    fileInput.addEventListener('change', () => {
      handleFile(fileInput.files[0]);
      // 清空，讓同一個檔案可以再次選擇
      fileInput.value = '';
    });

    // 拖曳功能
    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
      dropArea.addEventListener(eventName, e => e.preventDefault(), false);
    });

    dropArea.addEventListener('dragenter', () => dropArea.classList.add('dragover'));
    dropArea.addEventListener('dragleave', () => dropArea.classList.remove('dragover'));
    dropArea.addEventListener('dragover', () => dropArea.classList.add('dragover'));

    dropArea.addEventListener('drop', e => {
      dropArea.classList.remove('dragover');
      handleFile(e.dataTransfer.files[0]);
    });

    // Ctrl+V 貼上圖片
    document.addEventListener('paste', e => {
      const items = e.clipboardData ? Array.from(e.clipboardData.items) : [];
      const imageItem = items.find(item => item.kind === 'file' && item.type.startsWith('image/'));
      if (imageItem) {
        e.preventDefault();
        handleFile(imageItem.getAsFile());
      } else if (items.some(item => item.kind === 'file')) {
        showError('❌ 剪貼簿中的檔案不是圖片。');
      }
    });

    // 重置按鈕
    resetBtn.addEventListener('click', resetForm);

    // 全部搜尋：一次開啟所有搜尋引擎
    searchAllBtn.addEventListener('click', () => {
      let blocked = 0;
      SEARCH_ENGINES.forEach(engine => {
        const url = document.getElementById(engine.id).href;
        if (!url) return;
        const win = window.open(url, '_blank');
        if (win) {
          win.opener = null;
        } else {
          blocked++;
        }
      });

      if (blocked > 0) {
        popupHint.textContent = `⚠️ 瀏覽器擋下了 ${blocked} 個分頁。請在網址列允許此網站的「彈出式視窗」後再按一次，或直接點下方個別按鈕。`;
        popupHint.classList.add('show');
      } else {
        popupHint.classList.remove('show');
      }
    });

    function checkSavedImage() {
      try {
        const savedData = localStorage.getItem('uploadedImageData');
        if (savedData) {
          const data = JSON.parse(savedData);

          // 檢查是否過期
          if (Date.now() - data.uploadTime < EXPIRATION_MS) {
            // 未過期，恢復狀態
            restoreImageState(data);
          } else {
            // 已過期，清除資料
            localStorage.removeItem('uploadedImageData');
          }
        }
      } catch (e) {
        // localStorage 不可用時，直接跳過
        console.log('localStorage not available');
      }
    }

    function restoreImageState(data) {
      fileName.textContent = `已選擇：${data.fileName}`;
      fileInfo.classList.add('show');

      // 顯示圖片預覽
      previewImg.src = data.imageUrl;

      showResults(data.imageUrl, data.uploadTime);
    }

    function handleFile(file) {
      if (!file) return;

      if (!file.type.startsWith('image/')) {
        showError('❌ 這不是圖片檔案，請選擇 JPG、PNG、GIF、WEBP 等格式。');
        return;
      }

      if (file.size > MAX_FILE_SIZE) {
        const sizeMB = (file.size / 1024 / 1024).toFixed(1);
        showError(`❌ 圖片太大（${sizeMB}MB），最大只能 32MB。`);
        return;
      }

      const displayName = file.name || '剪貼簿圖片';
      fileName.textContent = `已選擇：${displayName}`;
      fileInfo.classList.add('show');

      // 顯示本地預覽
      if (previewObjectUrl) URL.revokeObjectURL(previewObjectUrl);
      previewObjectUrl = URL.createObjectURL(file);
      previewImg.src = previewObjectUrl;

      // 清除之前的結果
      hideElements();

      // 自動開始上傳
      uploadImage(file, displayName);
    }

    function hideElements() {
      statusDiv.classList.remove('show');
      errorDiv.classList.remove('show');
      resultButtons.classList.remove('show');
      popupHint.classList.remove('show');
      resetBtn.classList.remove('show');
      clearInterval(countdownInterval);
    }

    function abortUpload() {
      currentUploadId++;
      if (currentXhr) {
        currentXhr.abort();
        currentXhr = null;
      }
    }

    function clearPreview() {
      fileInfo.classList.remove('show');
      previewImg.removeAttribute('src');
      if (previewObjectUrl) {
        URL.revokeObjectURL(previewObjectUrl);
        previewObjectUrl = null;
      }
    }

    function clearSavedImage() {
      try {
        localStorage.removeItem('uploadedImageData');
      } catch (e) {
        console.log('localStorage not available');
      }
    }

    function resetForm() {
      abortUpload();
      fileInput.value = '';
      clearPreview();
      progressContainer.style.display = 'none';
      hideElements();
      progressFill.style.width = '0%';

      // 清除保存的資料
      clearSavedImage();
    }

    function uploadImage(file, displayName) {
      // 取消上一個還沒完成的上傳，避免結果互相覆蓋
      abortUpload();
      const uploadId = currentUploadId;

      // 顯示進度條
      progressContainer.style.display = 'block';
      updateProgress(0, '準備上傳...');

      const formData = new FormData();
      formData.append('image', file);
      const apiUrl = `https://api.imgbb.com/1/upload?expiration=${EXPIRATION_MS / 1000}&key=${IMGBB_API_KEY}`;

      const xhr = new XMLHttpRequest();
      currentXhr = xhr;
      xhr.open('POST', apiUrl);
      xhr.timeout = 60000;

      // 真實上傳進度（上傳完成後保留最後一段給伺服器處理）
      xhr.upload.onprogress = e => {
        if (uploadId !== currentUploadId || !e.lengthComputable) return;
        const percent = Math.round((e.loaded / e.total) * 90);
        updateProgress(percent, `正在上傳圖片... ${Math.round((e.loaded / e.total) * 100)}%`);
      };

      xhr.upload.onload = () => {
        if (uploadId !== currentUploadId) return;
        updateProgress(95, '伺服器處理中...');
      };

      xhr.onload = () => {
        if (uploadId !== currentUploadId) return;
        currentXhr = null;

        let result = null;
        try {
          result = JSON.parse(xhr.responseText);
        } catch (e) {
          // 非 JSON 回應（例如伺服器錯誤頁面）
        }

        if (xhr.status < 200 || xhr.status >= 300 || !result || !result.success) {
          const reason = result?.error?.message || `伺服器回應 ${xhr.status}`;
          uploadFailed('ImgBB 上傳失敗：' + reason);
          return;
        }

        onUploadSuccess(result.data.url, displayName, uploadId);
      };

      xhr.onerror = () => {
        if (uploadId !== currentUploadId) return;
        uploadFailed('網路錯誤，請檢查連線後再試一次。');
      };

      xhr.ontimeout = () => {
        if (uploadId !== currentUploadId) return;
        uploadFailed('上傳逾時，請再試一次。');
      };

      xhr.send(formData);
    }

    function uploadFailed(message) {
      currentXhr = null;
      progressContainer.style.display = 'none';
      showError('❌ 發生錯誤：' + message);
      resetBtn.classList.add('show');
    }

    function onUploadSuccess(imgUrl, displayName, uploadId) {
      updateProgress(100, '上傳完成！');

      setTimeout(() => {
        if (uploadId !== currentUploadId) return;
        progressContainer.style.display = 'none';

        const uploadTime = Date.now();

        // 保存圖片資料到本地存儲
        const imageData = {
          imageUrl: imgUrl,
          fileName: displayName,
          uploadTime: uploadTime
        };
        try {
          localStorage.setItem('uploadedImageData', JSON.stringify(imageData));
        } catch (e) {
          console.log('localStorage not available');
        }

        showResults(imgUrl, uploadTime);
      }, 500);
    }

    function showResults(imgUrl, uploadTime) {
      setupSearchButtons(imgUrl);

      // 顯示結果按鈕和重置按鈕
      resultButtons.classList.add('show');
      resetBtn.classList.add('show');

      // 開始倒數計時並顯示在狀態中
      startCountdownInStatus(uploadTime);
    }

    function setupSearchButtons(imgUrl) {
      const encodedUrl = encodeURIComponent(imgUrl);
      SEARCH_ENGINES.forEach(engine => {
        document.getElementById(engine.id).href = engine.buildUrl(encodedUrl);
      });
    }

    // 將倒數計時融入狀態顯示中
    function startCountdownInStatus(uploadTime) {
      function updateStatusWithCountdown() {
        const remaining = EXPIRATION_MS - (Date.now() - uploadTime);

        if (remaining <= 0) {
          // 時間到了，清除資料與已失效的預覽
          clearInterval(countdownInterval);
          clearSavedImage();
          clearPreview();
          resultButtons.classList.remove('show');
          showError('❌ 圖片連結已過期，請重新上傳。');
          return;
        }

        // 更新狀態顯示，包含倒數計時
        const minutes = Math.floor(remaining / 60000);
        const seconds = Math.floor((remaining % 60000) / 1000);
        const timeText = `${minutes}:${seconds.toString().padStart(2, '0')}`;

        showStatus(`✅ 上傳成功！圖片將在 ${timeText} 後刪除。`);
      }

      clearInterval(countdownInterval);

      // 立即執行一次
      updateStatusWithCountdown();

      // 每秒更新一次
      countdownInterval = setInterval(updateStatusWithCountdown, 1000);
    }

    function updateProgress(percent, text) {
      progressFill.style.width = percent + '%';
      progressText.textContent = text;
    }

    function showStatus(message) {
      statusDiv.textContent = message;
      statusDiv.classList.add('show');
      errorDiv.classList.remove('show');
    }

    function showError(message) {
      errorDiv.textContent = message;
      errorDiv.classList.add('show');
      statusDiv.classList.remove('show');
    }
  </script>
</body>
</html>
